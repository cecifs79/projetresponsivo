<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="card"><p>FRANÇA</p></div>
 <div class="card"><p>ESTADOS UNIDOS</p></div>
 <div class="card"><p>ESPANHA</p></div>
 <div class="card"><p>CHINA</p></div>
 <div class="card"><p>ITALIA</p></div>
 <div class="card"><p>TURQUIA</p></div>
 <div class="card grecia"><p>grecia</p></div>
</div>
<script>
    const cards = document.querySelectorAll('.card p');
    const estados = [
        'Acre', 'Alagoas', 'Amapá', 'Amazonas', 'Bahia', 'Ceará', 'Distrito Federal',
        'Espírito Santo', 'Goiás', 'Maranhão', 'Mato Grosso', 'Mato Grosso do Sul',
        'Minas Gerais', 'Pará', 'Paraíba', 'Paraná', 'Pernambuco', 'Piauí',
        'Rio de Janeiro', 'Rio Grande do Norte', 'Rio Grande do Sul', 'Rondônia',
        'Roraima', 'Santa Catarina', 'São Paulo', 'Sergipe', 'Tocantins'
    ];
    let index = 0;

    function atualizarCards() {
        // adiciona classe de fade para animar saída
        cards.forEach(card => card.classList.add('fade'));

        // após a transição, atualiza o texto e remove a classe
        setTimeout(() => {
            cards.forEach((card, idx) => {
                const estado = estados[(index + idx) % estados.length];
                card.textContent = estado.toUpperCase();
                card.classList.remove('fade');
            });
            index = (index + cards.length) % estados.length;
        }, 300);
    }

    // atualiza imediatamente sem esperar pela primeira transição
    atualizarCards();
    setInterval(atualizarCards, 5000);
</script>
</body>
</html>
